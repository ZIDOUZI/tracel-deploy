[package]
name = "tracel-deploy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Composable deployment and running-binary rotation helpers for tracel-xtask"
keywords = ["xtask", "deploy", "cargo", "release", "rotate"]
categories = ["development-tools"]

[features]
default = []
# Optional service lifecycle helpers (`stop -> rotate -> start -> probe`).
service = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracel-deploy-macros = { version = "0.4.0", path = "../tracel-deploy-macros" }
tracel-xtask.workspace = true

[dev-dependencies]
# Aliased for the crate-level `compile_fail` doctest, which shows the real
# `base_commands` ordering errors. (An xtask crate usually aliases this as
# `macros`, which is also what `tracel_xtask::prelude` re-exports.)
# Floor only, like the `tracel-xtask` dependency above: the consumer's version
# wins, and the lock keeps this crate on the line it was tested with.
xtask-macros = { package = "tracel-xtask-macros", version = ">=0.3" }

